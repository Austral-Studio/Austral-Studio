      <text x="620.0" y="113" font-size="12" fill="#9a9a9a"><tspan x="620.0" dy="0">Deploy, monitoreo, backups,</tspan><tspan x="620.0" dy="16">soporte. Una persona que</tspan><tspan x="620.0" dy="16">contesta.</tspan></text>
    </g></g>
