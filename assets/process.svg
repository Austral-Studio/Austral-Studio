  <line x1="36" y1="44" x2="636.0" y2="44" stroke="#8e8ff2" stroke-width="1.5" stroke-dasharray="600.0" stroke-dashoffset="600.0" opacity="0.8"><animate attributeName="stroke-dashoffset" from="600.0" to="0" begin="0.3s" dur="1.8s" calcMode="spline" keySplines="0.16 1 0.3 1" fill="freeze"/><animate attributeName="opacity" from="0.8" to="0" begin="2.1s" dur="0.8s" fill="freeze"/></line>
  <g class="t"><g><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.7s" fill="freeze"/>
      <circle cx="36.0" cy="44" r="16" fill="#111111" stroke="#8e8ff2" stroke-opacity="0.5"/>
      <circle cx="36.0" cy="44" r="16" fill="none" stroke="#8e8ff2" stroke-width="1.5" opacity="0"><animate attributeName="r" values="16;26" begin="0.6000000000000001s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/><animate attributeName="opacity" values="0.7;0" begin="0.6000000000000001s" dur="1s" fill="freeze"/></circle>
      <text x="36.0" y="48" text-anchor="middle" font-size="11" font-weight="600" fill="#8e8ff2" letter-spacing="0.5">01</text>
      <text x="20.0" y="90" font-size="16" font-weight="600" fill="#f5f3ec" letter-spacing="-0.3">Llamada</text>
      <text x="20.0" y="113" font-size="12" fill="#9a9a9a"><tspan x="20.0" dy="0">Treinta minutos. Nos contás</tspan><tspan x="20.0" dy="16">cómo trabajan hoy y qué</tspan><tspan x="20.0" dy="16">duele.</tspan></text>
    </g><g><animate attributeName="opacity" from="0" to="1" begin="0.8500000000000001s" dur="0.7s" fill="freeze"/>
      <circle cx="236.0" cy="44" r="16" fill="#111111" stroke="#8e8ff2" stroke-opacity="0.5"/>
      <circle cx="236.0" cy="44" r="16" fill="none" stroke="#8e8ff2" stroke-width="1.5" opacity="0"><animate attributeName="r" values="16;26" begin="1.05s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/><animate attributeName="opacity" values="0.7;0" begin="1.05s" dur="1s" fill="freeze"/></circle>
      <text x="236.0" y="48" text-anchor="middle" font-size="11" font-weight="600" fill="#8e8ff2" letter-spacing="0.5">02</text>
      <text x="220.0" y="90" font-size="16" font-weight="600" fill="#f5f3ec" letter-spacing="-0.3">Prototipo</text>
      <text x="220.0" y="113" font-size="12" fill="#9a9a9a"><tspan x="220.0" dy="0">En dos semanas, algo</tspan><tspan x="220.0" dy="16">clickeable con tus datos de</tspan><tspan x="220.0" dy="16">ejemplo.</tspan></text>
    </g><g><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.7s" fill="freeze"/>
      <circle cx="436.0" cy="44" r="16" fill="#111111" stroke="#8e8ff2" stroke-opacity="0.5"/>
      <circle cx="436.0" cy="44" r="16" fill="none" stroke="#8e8ff2" stroke-width="1.5" opacity="0"><animate attributeName="r" values="16;26" begin="1.5s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/><animate attributeName="opacity" values="0.7;0" begin="1.5s" dur="1s" fill="freeze"/></circle>
      <text x="436.0" y="48" text-anchor="middle" font-size="11" font-weight="600" fill="#8e8ff2" letter-spacing="0.5">03</text>
      <text x="420.0" y="90" font-size="16" font-weight="600" fill="#f5f3ec" letter-spacing="-0.3">Por etapas</text>
      <text x="420.0" y="113" font-size="12" fill="#9a9a9a"><tspan x="420.0" dy="0">Entregas cada dos o tres</tspan><tspan x="420.0" dy="16">semanas, cada una usable.</tspan></text>
    </g><g><animate attributeName="opacity" from="0" to="1" begin="1.75s" dur="0.7s" fill="freeze"/>
      <circle cx="636.0" cy="44" r="16" fill="#111111" stroke="#8e8ff2" stroke-opacity="0.5"/>
      <circle cx="636.0" cy="44" r="16" fill="none" stroke="#8e8ff2" stroke-width="1.5" opacity="0"><animate attributeName="r" values="16;26" begin="1.95s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1"/><animate attributeName="opacity" values="0.7;0" begin="1.95s" dur="1s" fill="freeze"/></circle>
      <text x="636.0" y="48" text-anchor="middle" font-size="11" font-weight="600" fill="#8e8ff2" letter-spacing="0.5">04</text>
