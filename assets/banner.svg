<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Austral Studio — Software a medida, en producción">
  <defs>
    <radialGradient id="glow" cx="0.22" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#4f46e5" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#4f46e5" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#8e8ff2" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8e8ff2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8e8ff2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="360" rx="24"/></clipPath>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
      .draw { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.4s cubic-bezier(.16,1,.3,1) .2s forwards; }
      .bar  { stroke-dasharray: 200; stroke-dashoffset: 200; animation: draw .6s cubic-bezier(.16,1,.3,1) 1s forwards; }
      .fade { opacity: 0; animation: fade .9s ease-out .6s forwards; }
      .fade2 { opacity: 0; animation: fade .9s ease-out .9s forwards; }
      .fade3 { opacity: 0; animation: fade .9s ease-out 1.2s forwards; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="#0a0a0a"/>
    <rect width="1280" height="360" fill="url(#dots)"/>
    <rect width="1280" height="360" fill="url(#glow)"/>
    <rect x="0" y="359" width="1280" height="1" fill="url(#line)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- logo -->
  <g transform="translate(88 84)">
    <rect width="192" height="192" rx="40" fill="#111111" stroke="#ffffff" stroke-opacity="0.12"/>
    <path class="draw" d="M44 164 L96 48 L148 164" fill="none" stroke="#f5f3ec" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="bar" d="M70 128 L122 128" fill="none" stroke="#f5f3ec" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- text -->
  <g class="t" transform="translate(330 0)">
    <g class="fade">
      <rect x="0" y="96" width="286" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle class="pulse" cx="18" cy="111" r="4" fill="#8e8ff2"/>
      <text x="32" y="116" font-size="14" font-weight="500" fill="#bdbdbd" letter-spacing="0.2">Estudio de software · Buenos Aires</text>
    </g>
    <text class="fade2" x="-2" y="188" font-size="58" font-weight="700" fill="#f5f3ec" letter-spacing="-1.8">Austral Studio</text>
    <text class="fade3" x="0" y="232" font-size="22" font-weight="400" fill="#9a9a9a" letter-spacing="-0.2">Software a medida que tu equipo usa todos los días.</text>
    <g class="fade3" transform="translate(0 262)" font-size="14" font-weight="500" fill="#8e8ff2">
      <text x="0" y="12">Sistemas de gestión</text>
      <text x="150" y="12" fill="#4a4a4a">·</text>
      <text x="166" y="12">Apps iPhone y Mac</text>
      <text x="306" y="12" fill="#4a4a4a">·</text>
      <text x="322" y="12">Web y tiendas</text>
      <text x="428" y="12" fill="#4a4a4a">·</text>
      <text x="444" y="12">Automatización e IA</text>
    </g>
  </g>

  <!-- url -->
  <g class="t fade3">
    <text x="1192" y="326" text-anchor="end" font-size="14" font-weight="500" fill="#6f6f6f" letter-spacing="0.3">austral-studio.com</text>
  </g>
</svg>
